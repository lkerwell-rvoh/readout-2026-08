<style>
  :root { color-scheme: light;
    --bg: #FAF9F7; --card: #FFFFFF; --ink: #1B160F; --muted: #6A6357;
    --line: #EDE9E3; --line2: #CAC1B5; --accent: #CA8702; --err: #B83313; }
  
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--ink);
    font: 400 17px/1.55 "Phren Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .box { width: 100%; max-width: 440px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 34px 32px 30px; }
  .kick { font-size: 14px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); display: flex; align-items: center; gap: 9px; }
  .kick i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  h1 { margin: 16px 0 0; font: 600 25px/1.25 "Larken", "Fraunces", Georgia, serif; letter-spacing: -.01em; }
  p { margin: 12px 0 0; font-size: 16px; color: var(--muted); }
  label { display: block; margin-top: 26px; font-size: 14px; font-weight: 600;
    letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  input { width: 100%; margin-top: 9px; font: inherit; font-size: 17px; letter-spacing: .02em;
    padding: 13px 14px; min-height: 48px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line2); border-radius: 8px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button { width: 100%; margin-top: 14px; font: inherit; font-size: 17px; font-weight: 600;
    min-height: 48px; color: var(--bg); background: var(--ink);
    border: 0; border-radius: 8px; cursor: pointer;
    transition: opacity 140ms cubic-bezier(.23,1,.32,1), transform 140ms cubic-bezier(.23,1,.32,1); }
  button:hover { opacity: .9; } button:active { transform: scale(.98); }
  button[disabled] { opacity: .55; cursor: default; transform: none; }
  .msg { margin-top: 16px; font-size: 16px; min-height: 24px; }
  .msg.bad { color: var(--err); } .msg.busy { color: var(--muted); }
  .foot { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 14px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } button:active { transform: none; } }
</style>

<script>
(function () {
  'use strict';
  var P = JSON.parse(document.getElementById('payload').textContent);
  var f = document.getElementById('f'), inp = document.getElementById('p'),
      btn = document.getElementById('b'), msg = document.getElementById('m');

  function b2a(b64) {
    var s = atob(b64), u = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return u;
  }
  function say(t, cls) { msg.textContent = t; msg.className = 'msg' + (cls ? ' ' + cls : ''); }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = inp.value;
    if (!pw) return;
    btn.disabled = true;
    say('Deriving key — this takes a moment…', 'busy');

    var salt = b2a(P.salt), iv = b2a(P.iv), mac = b2a(P.mac), ct = b2a(P.ct);
    var enc = new TextEncoder();

    crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) {
        return crypto.subtle.deriveBits(
          { name: 'PBKDF2', salt: salt, iterations: P.iter, hash: 'SHA-256' }, base, 512);
      })
      .then(function (bits) {
        var km = new Uint8Array(bits);
        var encKey = km.slice(0, 32), macKey = km.slice(32);
        var signed = new Uint8Array(salt.length + iv.length + ct.length);
        signed.set(salt, 0); signed.set(iv, salt.length); signed.set(ct, salt.length + iv.length);

        return crypto.subtle.importKey('raw', macKey, { name: 'HMAC', hash: 'SHA-256' }, false, ['verify'])
          .then(function (mk) { return crypto.subtle.verify('HMAC', mk, mac, signed); })
          .then(function (ok) {
            if (!ok) throw new Error('bad passphrase');
            return crypto.subtle.importKey('raw', encKey, { name: 'AES-CBC' }, false, ['decrypt']);
          })
          .then(function (ek) {
            return crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, ek, ct);
          });
      })
      .then(function (plain) {
        var html = new TextDecoder().decode(plain);
        say('Unlocked.', 'busy');
        document.open(); document.write(html); document.close();
      })
      .catch(function () {
        btn.disabled = false;
        say('That passphrase is not correct.', 'bad');
        inp.select();
      });
  });
  inp.focus();
})();
</script>
